<svg viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Premium Gradient Definitions -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
  </defs>
  
  <!-- Decorative Flower on Right -->
  <g transform="translate(480, 35)">
    <!-- Curved stem with leaves -->
    <path d="M 0 0 Q 15 10 20 35" stroke="url(#goldGradient)" stroke-width="2.5" fill="none" opacity="0.8"/>
    
    <!-- Leaf 1 -->
    <path d="M 8 8 Q 12 12 10 18" stroke="url(#goldGradient)" stroke-width="2" fill="none" opacity="0.7"/>
    <ellipse cx="11" cy="13" rx="4" ry="7" fill="url(#goldGradient)" opacity="0.5" transform="rotate(-35 11 13)"/>
    
    <!-- Leaf 2 -->
    <path d="M 15 18 Q 22 20 24 28" stroke="url(#goldGradient)" stroke-width="2" fill="none" opacity="0.7"/>
    <ellipse cx="22" cy="24" rx="4" ry="7" fill="url(#goldGradient)" opacity="0.5" transform="rotate(40 22 24)"/>
    
    <!-- Main Flower -->
    <g>
      <!-- Petals -->
      <circle cx="0" cy="-12" r="5.5" fill="url(#goldGradient)" opacity="0.85"/>
      <circle cx="10" cy="-6" r="5.5" fill="url(#goldGradient)" opacity="0.85"/>
      <circle cx="10" cy="6" r="5.5" fill="url(#goldGradient)" opacity="0.85"/>
      <circle cx="0" cy="12" r="5.5" fill="url(#goldGradient)" opacity="0.85"/>
      <circle cx="-10" cy="6" r="5.5" fill="url(#goldGradient)" opacity="0.85"/>
      <circle cx="-10" cy="-6" r="5.5" fill="url(#goldGradient)" opacity="0.85"/>
      <!-- Center -->
      <circle cx="0" cy="0" r="5" fill="#DAA520"/>
    </g>
  </g>
  
  <!-- Decorative Sparkles -->
  <g fill="url(#goldGradient)" opacity="0.7">
    <polygon points="470,15 473,22 481,22 475,27 478,34 470,29 462,34 465,27 459,22 467,22" />
    <polygon points="520,20 522,26 529,26 524,30 526,36 520,32 514,36 516,30 511,26 518,26" />
    <polygon points="490,5 491,9 497,9 492,12 494,16 490,13 486,16 488,12 483,9 489,9" />
  </g>
  
  <!-- Main Brand Text: AARZAH -->
  <text x="240" y="95" font-family="Georgia, serif" font-size="72" font-weight="300" letter-spacing="6" fill="#2C2C2C" text-anchor="middle">
    AARZAH
  </text>
  
  <!-- Tagline: Aapki Aarzoo, hamari pehchaan -->
  <text x="240" y="145" font-family="Georgia, serif" font-size="20" font-style="italic" letter-spacing="1" fill="#4C4C4C" text-anchor="middle" opacity="0.9">
    Aapki Aarzoo, hamari pehchaan
  </text>
  
  <!-- Decorative Accent Line -->
  <line x1="80" y1="155" x2="400" y2="155" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.5"/>
</svg>